name: chatex
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  file_picker: ^10.3.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.2

  firebase_core: ^4.12.0
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.0.2
  image_picker: ^1.1.2
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.0.0

  intl: ^0.20.2
  cloudinary_public: ^0.23.1
  http: ^1.5.0

  record: ^6.1.1
  just_audio: ^0.10.4
  flutter_tts: ^4.2.3

  cached_network_image: ^3.4.1

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3

  camera: ^0.11.0
  path_provider: ^2.1.5

  emoji_picker_flutter: ^4.3.0

  geolocator: ^14.0.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  location: ^8.0.1
  video_player: ^2.10.0
  flutter_webrtc: ^1.2.1
  permission_handler: ^12.0.1
  uuid: ^4.5.1
  image_gallery_saver_plus: ^5.1.1
  gal: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/icon/chattax_icon.png
    - assets/chatex_logo.png
    - assets/login_background.jpeg
    - assets/ai_robot.jpeg
    - assets/chatex_logoo.png
    - assets/story1.jpg
    - assets/chat_background.png
    - assets/outgoing_voice_call_background.png
    - assets/audio/outgoing_ringtone.mp3
    - assets/audio/incoming_ringtone.mp3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/chattax_icon.png"